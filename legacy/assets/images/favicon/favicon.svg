<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Primary gradient -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0055FF"/>
      <stop offset="100%" style="stop-color:#00D4AA"/>
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0055FF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" ry="96" fill="#0A1628"/>

  <!-- Inner glow circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#primaryGradient)" stroke-width="2" opacity="0.3"/>

  <!-- Decorative corner accents -->
  <path d="M100 80 L80 80 L80 100" stroke="url(#primaryGradient)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M412 80 L432 80 L432 100" stroke="url(#primaryGradient)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M80 412 L80 432 L100 432" stroke="url(#primaryGradient)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M432 412 L432 432 L412 432" stroke="url(#primaryGradient)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>

  <!-- Letter A - Modern geometric style -->
  <g filter="url(#shadow)">
    <path d="M168 340 L220 172 C224 160 232 152 244 152 L244 152 C256 152 264 160 268 172 L320 340"
          stroke="url(#primaryGradient)"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
    <!-- A crossbar -->
    <path d="M185 280 L303 280"
          stroke="url(#primaryGradient)"
          stroke-width="24"
          stroke-linecap="round"
          fill="none"/>
  </g>

  <!-- Letter L - Modern style with accent -->
  <g filter="url(#shadow)">
    <path d="M340 152 L340 340 L420 340"
          stroke="#FFFFFF"
          stroke-width="32"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>
  </g>

  <!-- Accent dot -->
  <circle cx="420" cy="340" r="16" fill="url(#primaryGradient)" filter="url(#glow)"/>

  <!-- Small decorative elements -->
  <circle cx="140" cy="152" r="6" fill="url(#primaryGradient)" opacity="0.8"/>
  <circle cx="372" cy="432" r="4" fill="#00D4AA" opacity="0.6"/>
  <circle cx="432" cy="140" r="5" fill="#0055FF" opacity="0.7"/>
</svg>
