<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A1628"/>

  <!-- Gradient Overlay -->
  <defs>
    <linearGradient id="gradientBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A2744;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A1628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0055FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4AA;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowBlue" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#0055FF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0055FF;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glowGreen" cx="80%" cy="70%" r="50%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#00D4AA;stop-opacity:0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gradientBg)"/>

  <!-- Glow Effects -->
  <ellipse cx="240" cy="189" rx="400" ry="300" fill="url(#glowBlue)"/>
  <ellipse cx="960" cy="441" rx="350" ry="250" fill="url(#glowGreen)"/>

  <!-- Grid Pattern -->
  <g opacity="0.1">
    <line x1="0" y1="105" x2="1200" y2="105" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="525" x2="1200" y2="525" stroke="#ffffff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Logo -->
  <g transform="translate(80, 50)">
    <text font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="700" fill="#ffffff">
      Anton<tspan fill="#0055FF">Logic</tspan>
    </text>
  </g>

  <!-- Main Title -->
  <text x="600" y="260" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="64" font-weight="700" fill="#ffffff">
    Transformamos ideas en
  </text>
  <text x="600" y="340" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="64" font-weight="700" fill="url(#textGradient)">
    soluciones digitales
  </text>

  <!-- Subtitle -->
  <text x="600" y="420" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="24" fill="#9CA3AF">
    Desarrollo Web | Software a Medida | Sistemas Legacy | APIs
  </text>

  <!-- CTA Badge -->
  <g transform="translate(480, 470)">
    <rect x="0" y="0" width="240" height="48" rx="24" fill="#0055FF"/>
    <text x="120" y="32" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="600" fill="#ffffff">
      antonlogic.com
    </text>
  </g>

  <!-- Decorative Elements -->
  <circle cx="100" cy="530" r="8" fill="#0055FF" opacity="0.8"/>
  <circle cx="140" cy="550" r="5" fill="#00D4AA" opacity="0.6"/>
  <circle cx="1100" cy="100" r="10" fill="#00D4AA" opacity="0.8"/>
  <circle cx="1060" cy="80" r="6" fill="#0055FF" opacity="0.6"/>

  <!-- Code Snippet Decoration -->
  <g transform="translate(900, 140)" opacity="0.6">
    <rect x="0" y="0" width="220" height="120" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="15" y="30" font-family="monospace" font-size="12" fill="#569CD6">const</text>
    <text x="55" y="30" font-family="monospace" font-size="12" fill="#9CDCFE">success</text>
    <text x="115" y="30" font-family="monospace" font-size="12" fill="#ffffff">=</text>
    <text x="130" y="30" font-family="monospace" font-size="12" fill="#CE9178">"delivered"</text>
    <text x="15" y="55" font-family="monospace" font-size="12" fill="#569CD6">const</text>
    <text x="55" y="55" font-family="monospace" font-size="12" fill="#9CDCFE">quality</text>
    <text x="107" y="55" font-family="monospace" font-size="12" fill="#ffffff">=</text>
    <text x="122" y="55" font-family="monospace" font-size="12" fill="#B5CEA8">100</text>
    <text x="15" y="80" font-family="monospace" font-size="12" fill="#569CD6">const</text>
    <text x="55" y="80" font-family="monospace" font-size="12" fill="#9CDCFE">support</text>
    <text x="112" y="80" font-family="monospace" font-size="12" fill="#ffffff">=</text>
    <text x="127" y="80" font-family="monospace" font-size="12" fill="#569CD6">true</text>
  </g>
</svg>