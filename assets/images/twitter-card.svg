<svg width="1200" height="628" viewBox="0 0 1200 628" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="628" fill="#0A1628"/>

  <!-- Gradient Overlay -->
  <defs>
    <linearGradient id="gradientBgTw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A2744;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A1628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradientTw" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0055FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4AA;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowBlueTw" cx="30%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#0055FF;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0055FF;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glowGreenTw" cx="70%" cy="60%" r="50%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#00D4AA;stop-opacity:0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="628" fill="url(#gradientBgTw)"/>

  <!-- Glow Effects -->
  <ellipse cx="360" cy="250" rx="400" ry="300" fill="url(#glowBlueTw)"/>
  <ellipse cx="840" cy="378" rx="350" ry="250" fill="url(#glowGreenTw)"/>

  <!-- Subtle Grid -->
  <g opacity="0.06">
    <line x1="0" y1="157" x2="1200" y2="157" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="314" x2="1200" y2="314" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="471" x2="1200" y2="471" stroke="#ffffff" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="628" stroke="#ffffff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="628" stroke="#ffffff" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="628" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Logo Large -->
  <g transform="translate(600, 160)">
    <text x="0" y="0" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="72" font-weight="700" fill="#ffffff">
      Anton<tspan fill="#0055FF">Logic</tspan>
    </text>
  </g>

  <!-- Tagline -->
  <text x="600" y="260" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="28" fill="url(#textGradientTw)">
    Desarrollo de Software & Soluciones Digitales
  </text>

  <!-- Main Message -->
  <text x="600" y="350" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="48" font-weight="600" fill="#ffffff">
    Transformamos ideas en
  </text>
  <text x="600" y="410" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="48" font-weight="600" fill="url(#textGradientTw)">
    resultados reales
  </text>

  <!-- Services -->
  <g transform="translate(200, 480)">
    <circle cx="0" cy="8" r="6" fill="#0055FF"/>
    <text x="20" y="14" font-family="'DM Sans', sans-serif" font-size="18" fill="#9CA3AF">Desarrollo Web</text>
  </g>
  <g transform="translate(400, 480)">
    <circle cx="0" cy="8" r="6" fill="#00D4AA"/>
    <text x="20" y="14" font-family="'DM Sans', sans-serif" font-size="18" fill="#9CA3AF">Software a Medida</text>
  </g>
  <g transform="translate(630, 480)">
    <circle cx="0" cy="8" r="6" fill="#0055FF"/>
    <text x="20" y="14" font-family="'DM Sans', sans-serif" font-size="18" fill="#9CA3AF">Sistemas Legacy</text>
  </g>
  <g transform="translate(850, 480)">
    <circle cx="0" cy="8" r="6" fill="#00D4AA"/>
    <text x="20" y="14" font-family="'DM Sans', sans-serif" font-size="18" fill="#9CA3AF">APIs & Backend</text>
  </g>

  <!-- CTA -->
  <g transform="translate(480, 540)">
    <rect x="0" y="0" width="240" height="50" rx="25" fill="#0055FF"/>
    <text x="120" y="33" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="600" fill="#ffffff">
      antonlogic.com
    </text>
  </g>

  <!-- Decorative -->
  <circle cx="100" cy="100" r="50" fill="rgba(0,85,255,0.1)" stroke="rgba(0,85,255,0.2)" stroke-width="1"/>
  <circle cx="1100" cy="530" r="40" fill="rgba(0,212,170,0.1)" stroke="rgba(0,212,170,0.2)" stroke-width="1"/>
  <circle cx="80" cy="530" r="6" fill="#00D4AA" opacity="0.7"/>
  <circle cx="1120" cy="100" r="8" fill="#0055FF" opacity="0.7"/>
</svg>