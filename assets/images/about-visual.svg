<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#1A2744"/>
    </linearGradient>
    <linearGradient id="aboutAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055FF"/>
      <stop offset="100%" stop-color="#00D4AA"/>
    </linearGradient>
  </defs>

  <!-- Main Browser Window -->
  <rect x="30" y="30" width="340" height="280" rx="12" fill="url(#aboutBg)" stroke="#2A3B5C" stroke-width="2"/>

  <!-- Browser Header -->
  <rect x="30" y="30" width="340" height="40" rx="12" fill="#1A2744"/>
  <rect x="30" y="58" width="340" height="12" fill="#1A2744"/>

  <!-- Browser Dots -->
  <circle cx="55" cy="50" r="6" fill="#FF5F56"/>
  <circle cx="77" cy="50" r="6" fill="#FFBD2E"/>
  <circle cx="99" cy="50" r="6" fill="#27CA40"/>

  <!-- URL Bar -->
  <rect x="130" y="42" width="180" height="16" rx="8" fill="#0A1628"/>
  <text x="145" y="54" font-family="Arial, sans-serif" font-size="9" fill="#6B7280">antonlogic.com</text>

  <!-- Code Lines -->
  <text x="50" y="95" font-family="monospace" font-size="11" fill="#569CD6">import</text>
  <text x="95" y="95" font-family="monospace" font-size="11" fill="#9CDCFE">{ success }</text>
  <text x="175" y="95" font-family="monospace" font-size="11" fill="#569CD6">from</text>
  <text x="205" y="95" font-family="monospace" font-size="11" fill="#CE9178">'anton-logic'</text>

  <text x="50" y="115" font-family="monospace" font-size="11" fill="#6A9955">// Transforming ideas into solutions</text>

  <text x="50" y="140" font-family="monospace" font-size="11" fill="#569CD6">const</text>
  <text x="85" y="140" font-family="monospace" font-size="11" fill="#9CDCFE">project</text>
  <text x="135" y="140" font-family="monospace" font-size="11" fill="#ffffff">=</text>
  <text x="145" y="140" font-family="monospace" font-size="11" fill="#ffffff">{</text>

  <text x="65" y="160" font-family="monospace" font-size="11" fill="#9CDCFE">quality:</text>
  <text x="125" y="160" font-family="monospace" font-size="11" fill="#CE9178">"premium"</text>
  <text x="190" y="160" font-family="monospace" font-size="11" fill="#ffffff">,</text>

  <text x="65" y="180" font-family="monospace" font-size="11" fill="#9CDCFE">support:</text>
  <text x="130" y="180" font-family="monospace" font-size="11" fill="#569CD6">true</text>
  <text x="160" y="180" font-family="monospace" font-size="11" fill="#ffffff">,</text>

  <text x="65" y="200" font-family="monospace" font-size="11" fill="#9CDCFE">legacy:</text>
  <text x="120" y="200" font-family="monospace" font-size="11" fill="#CE9178">"modernized"</text>
  <text x="200" y="200" font-family="monospace" font-size="11" fill="#ffffff">,</text>

  <text x="65" y="220" font-family="monospace" font-size="11" fill="#9CDCFE">satisfaction:</text>
  <text x="155" y="220" font-family="monospace" font-size="11" fill="#B5CEA8">100</text>

  <text x="50" y="240" font-family="monospace" font-size="11" fill="#ffffff">}</text>

  <text x="50" y="265" font-family="monospace" font-size="11" fill="#DCDCAA">deploy</text>
  <text x="95" y="265" font-family="monospace" font-size="11" fill="#ffffff">(project)</text>

  <!-- Cursor Blink -->
  <rect x="155" y="252" width="8" height="15" fill="#0055FF">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- Terminal Window -->
  <rect x="280" y="180" width="180" height="130" rx="8" fill="#1A2744" stroke="#2A3B5C" stroke-width="2"/>
  <rect x="280" y="180" width="180" height="28" rx="8" fill="#2A3B5C"/>
  <rect x="280" y="198" width="180" height="10" fill="#2A3B5C"/>

  <!-- Terminal Dots -->
  <circle cx="298" cy="194" r="5" fill="#FF5F56"/>
  <circle cx="315" cy="194" r="5" fill="#FFBD2E"/>
  <circle cx="332" cy="194" r="5" fill="#27CA40"/>

  <text x="355" y="198" font-family="Arial, sans-serif" font-size="10" fill="#6B7280">Terminal</text>

  <!-- Terminal Content -->
  <text x="295" y="230" font-family="monospace" font-size="10" fill="#00D4AA">$</text>
  <text x="308" y="230" font-family="monospace" font-size="10" fill="#ffffff">npm run build</text>

  <text x="295" y="250" font-family="monospace" font-size="10" fill="#00D4AA">✓</text>
  <text x="308" y="250" font-family="monospace" font-size="10" fill="#9CA3AF">Build successful</text>

  <text x="295" y="270" font-family="monospace" font-size="10" fill="#00D4AA">$</text>
  <text x="308" y="270" font-family="monospace" font-size="10" fill="#ffffff">npm run deploy</text>

  <text x="295" y="290" font-family="monospace" font-size="10" fill="#00D4AA">✓</text>
  <text x="308" y="290" font-family="monospace" font-size="10" fill="#9CA3AF">Deployed to prod</text>

  <!-- Floating Elements -->
  <circle cx="420" cy="80" r="35" fill="#0055FF" fill-opacity="0.1" stroke="#0055FF" stroke-opacity="0.3" stroke-width="2"/>
  <text x="420" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#0055FF">JS</text>

  <circle cx="470" cy="150" r="25" fill="#00D4AA" fill-opacity="0.1" stroke="#00D4AA" stroke-opacity="0.3" stroke-width="2"/>
  <text x="470" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#00D4AA">API</text>

  <circle cx="450" cy="350" r="30" fill="#0055FF" fill-opacity="0.1" stroke="#0055FF" stroke-opacity="0.3" stroke-width="2"/>
  <path d="M440 350 L445 355 L460 340" stroke="#0055FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Connection Lines -->
  <path d="M370 200 Q 400 150 420 115" stroke="#0055FF" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="5,5" fill="none"/>
  <path d="M460 200 Q 470 175 470 175" stroke="#00D4AA" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="5,5" fill="none"/>

  <!-- Small Decorative Dots -->
  <circle cx="50" cy="350" r="4" fill="#0055FF" opacity="0.6"/>
  <circle cx="70" cy="365" r="3" fill="#00D4AA" opacity="0.5"/>
  <circle cx="100" cy="340" r="5" fill="#0055FF" opacity="0.4"/>
</svg>