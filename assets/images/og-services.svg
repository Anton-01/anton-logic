<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A1628"/>

  <!-- Gradient Overlay -->
  <defs>
    <linearGradient id="gradientBgSvc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A1628;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A2744;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0A1628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradientSvc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0055FF;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowBlueSvc" cx="20%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#00D4AA;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#00D4AA;stop-opacity:0" />
    </radialGradient>
    <radialGradient id="glowGreenSvc" cx="80%" cy="70%" r="50%">
      <stop offset="0%" style="stop-color:#0055FF;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#0055FF;stop-opacity:0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#gradientBgSvc)"/>

  <!-- Glow Effects -->
  <ellipse cx="200" cy="200" rx="350" ry="280" fill="url(#glowBlueSvc)"/>
  <ellipse cx="1000" cy="450" rx="380" ry="280" fill="url(#glowGreenSvc)"/>

  <!-- Grid Pattern -->
  <g opacity="0.08">
    <line x1="0" y1="105" x2="1200" y2="105" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="525" x2="1200" y2="525" stroke="#ffffff" stroke-width="1"/>
    <line x1="200" y1="0" x2="200" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="630" stroke="#ffffff" stroke-width="1"/>
    <line x1="1000" y1="0" x2="1000" y2="630" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Logo -->
  <g transform="translate(80, 50)">
    <text font-family="'Space Grotesk', sans-serif" font-size="36" font-weight="700" fill="#ffffff">
      Anton<tspan fill="#0055FF">Logic</tspan>
    </text>
  </g>

  <!-- Badge -->
  <g transform="translate(80, 180)">
    <rect x="0" y="0" width="180" height="36" rx="18" fill="rgba(0,212,170,0.2)"/>
    <text x="90" y="24" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="600" fill="#00D4AA">
      SERVICIOS
    </text>
  </g>

  <!-- Main Title -->
  <text x="80" y="290" font-family="'Space Grotesk', sans-serif" font-size="56" font-weight="700" fill="#ffffff">
    Modernizamos tu
  </text>
  <text x="80" y="365" font-family="'Space Grotesk', sans-serif" font-size="56" font-weight="700" fill="url(#textGradientSvc)">
    Sistema Legacy
  </text>

  <!-- Subtitle -->
  <text x="80" y="430" font-family="'DM Sans', sans-serif" font-size="22" fill="#9CA3AF">
    Migraciones seguras | Integraciones modernas | Soporte continuo
  </text>

  <!-- Services Pills -->
  <g transform="translate(80, 480)">
    <rect x="0" y="0" width="160" height="40" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="80" y="27" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="14" fill="#ffffff">Desarrollo Web</text>
  </g>
  <g transform="translate(260, 480)">
    <rect x="0" y="0" width="180" height="40" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="90" y="27" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="14" fill="#ffffff">Software a Medida</text>
  </g>
  <g transform="translate(460, 480)">
    <rect x="0" y="0" width="140" height="40" rx="20" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="70" y="27" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="14" fill="#ffffff">APIs & Backend</text>
  </g>
  <g transform="translate(620, 480)">
    <rect x="0" y="0" width="130" height="40" rx="20" fill="rgba(0,212,170,0.25)" stroke="rgba(0,212,170,0.4)" stroke-width="1"/>
    <text x="65" y="27" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="14" font-weight="600" fill="#00D4AA">Legacy</text>
  </g>

  <!-- Visual Element - Code transformation -->
  <g transform="translate(750, 140)">
    <!-- Old System Box -->
    <rect x="0" y="0" width="180" height="100" rx="8" fill="rgba(255,107,53,0.1)" stroke="rgba(255,107,53,0.3)" stroke-width="1"/>
    <text x="90" y="30" text-anchor="middle" font-family="monospace" font-size="11" fill="#FF6B35">COBOL / VB6</text>
    <text x="90" y="50" text-anchor="middle" font-family="monospace" font-size="11" fill="#9CA3AF">status: deprecated</text>
    <text x="90" y="70" text-anchor="middle" font-family="monospace" font-size="11" fill="#9CA3AF">support: none</text>

    <!-- Arrow -->
    <g transform="translate(200, 35)">
      <line x1="0" y1="15" x2="60" y2="15" stroke="#00D4AA" stroke-width="2"/>
      <polygon points="55,8 70,15 55,22" fill="#00D4AA"/>
    </g>

    <!-- New System Box -->
    <rect x="270" y="0" width="180" height="100" rx="8" fill="rgba(0,212,170,0.15)" stroke="rgba(0,212,170,0.4)" stroke-width="1"/>
    <text x="360" y="30" text-anchor="middle" font-family="monospace" font-size="11" fill="#00D4AA">Node.js / React</text>
    <text x="360" y="50" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffffff">status: production</text>
    <text x="360" y="70" text-anchor="middle" font-family="monospace" font-size="11" fill="#ffffff">cloud: enabled</text>
  </g>

  <!-- Success Indicators -->
  <g transform="translate(880, 280)">
    <circle cx="0" cy="0" r="20" fill="#00D4AA"/>
    <path d="M-8 0 L-3 5 L8 -6" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <text x="920" y="288" font-family="'DM Sans', sans-serif" font-size="18" font-weight="600" fill="#ffffff">
    Migración exitosa
  </text>

  <g transform="translate(880, 340)">
    <circle cx="0" cy="0" r="20" fill="#0055FF"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#ffffff">3x</text>
  </g>
  <text x="920" y="348" font-family="'DM Sans', sans-serif" font-size="18" font-weight="600" fill="#ffffff">
    Más rendimiento
  </text>

  <!-- Decorative Elements -->
  <circle cx="1120" cy="560" r="40" fill="rgba(0,85,255,0.2)" stroke="rgba(0,85,255,0.4)" stroke-width="1"/>
  <circle cx="1100" cy="100" r="6" fill="#00D4AA" opacity="0.8"/>
  <circle cx="1130" cy="120" r="4" fill="#0055FF" opacity="0.6"/>
</svg>